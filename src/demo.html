<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23cfb16c'/%3E%3Cpath d='M9 23 16 8 23 23M12 18h8' fill='none' stroke='%235c4927' stroke-width='2'/%3E%3C/svg%3E">
  <title>Aurum · 日月硬币</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; color:#273330; background:#efeee8; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    a { color:inherit; } button { font:inherit; }
    .page { max-width:1080px; margin:0 auto; padding:46px 48px 28px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:34px; }
    .brand { display:flex; align-items:center; gap:14px; }
    .brand svg { width:32px; height:32px; }
    .wordmark { font-family:Georgia,"Times New Roman",serif; font-size:25px; letter-spacing:5px; line-height:1; }
    .brand-sub { color:#6c766d; font-size:10px; letter-spacing:3px; margin-top:7px; }
    .edition { font-size:10px; color:#737d73; letter-spacing:2px; }
    main { display:grid; grid-template-columns:minmax(0,1.44fr) minmax(260px,1fr); gap:54px; align-items:start; }
    aurum-coin { box-shadow:0 24px 50px #26332613; border-radius:20px; }
    aside { padding-top:22px; }
    .kicker { font-size:10px; font-weight:500; letter-spacing:2.5px; color:#8c7951; }
    h1 { font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif; font-size:36px; font-weight:400; letter-spacing:3px; margin:14px 0 12px; }
    .description { margin:0; color:#71796e; font-size:12px; line-height:1.9; letter-spacing:.6px; }
    .asset-heading { display:flex; justify-content:space-between; font-size:10px; color:#8b9388; letter-spacing:1.5px; margin:31px 0 0; padding-bottom:13px; border-bottom:1px solid #d9dcd1; }
    .asset { display:grid; grid-template-columns:95px minmax(0,1fr) 20px; align-items:center; gap:11px; text-decoration:none; border-bottom:1px solid #d9dcd1; padding:4px 0; transition:background .2s; }
    .asset:hover { background:#e4e5da70; }
    .asset svg { width:95px; height:95px; display:block; filter:drop-shadow(0 4px 4px #53452120); }
    .asset h2 { font-size:13px; font-weight:500; margin:0 0 7px; letter-spacing:.5px; }
    .asset p { font-size:10px; color:#92998d; letter-spacing:1px; margin:0; }
    .arrow { color:#7e8b7d; font-size:17px; }
    .asset:hover .arrow { color:#8d682b; }
    .download { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:27px; font-size:12px; text-decoration:none; color:#455a47; }
    .download:hover { text-decoration:underline; text-underline-offset:4px; }
    .note { color:#8a9387; font-size:10px; line-height:1.7; margin:14px 0 0; }
    footer { display:flex; justify-content:space-between; gap:20px; margin-top:29px; color:#92998e; font-size:9px; letter-spacing:1.8px; }
    a:focus-visible { outline:2px solid #9b8348; outline-offset:5px; border-radius:4px; }
    @media (max-width:750px) { .page{max-width:510px;padding:18px 20px 24px} header{margin-bottom:18px;gap:12px}.brand{gap:11px}.brand svg{width:28px;height:28px}.wordmark{font-size:21px;letter-spacing:4px}.brand-sub{margin-top:4px}.edition{font-size:8px;letter-spacing:1px;white-space:nowrap;text-align:right}main{grid-template-columns:1fr;gap:25px}aside{padding:0 9px}h1{font-size:30px}.asset{grid-template-columns:85px 1fr 20px}.asset svg{width:85px;height:85px}.asset-heading{margin-top:25px}footer{font-size:8px;letter-spacing:1px;line-height:1.8} }
    @media (max-width:750px) and (max-height:700px) { .page{padding-top:12px} header{margin-bottom:8px} .brand-sub{margin-top:2px} }
    @media (max-width:420px) { .edition{display:none} }
    @media (prefers-reduced-motion:reduce) { *{transition:none !important} }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand"><svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><circle cx="18" cy="18" r="16" stroke="#8c7951"/><circle cx="18" cy="18" r="12" stroke="#8c7951" stroke-width=".5"/><path d="M10 25 18 9 26 25M13 20h10" stroke="#8c7951" stroke-width="1.2"/></svg><div><div class="wordmark">AURUM</div><div class="brand-sub">日 月 硬 币</div></div></div>
      <span class="edition">OBJECTS OF CHANCE · Nº 001</span>
    </header>
    <main>
      <aurum-coin id="coin"></aurum-coin>
      <aside>
        <div class="kicker">TWO SIDES. ONE POSSIBILITY.</div>
        <h1>一掷之间。</h1>
        <p class="description">日曜或月相，让一枚小小的硬币，<br>为犹豫的时刻添一点偶然。</p>
        <div class="asset-heading"><span>一枚硬币，三个瞬间</span><span>SVG ↓</span></div>
        <a class="asset" href="assets/coin-front.svg" download="coin-front.svg" aria-label="下载日曜正面 SVG"><div><!-- PREVIEW_FRONT --></div><div><h2>日曜 · 正面</h2><p>01 / OBVERSE</p></div><span class="arrow" aria-hidden="true">↗</span></a>
        <a class="asset" href="assets/coin-back.svg" download="coin-back.svg" aria-label="下载月相反面 SVG"><div><!-- PREVIEW_BACK --></div><div><h2>月相 · 反面</h2><p>02 / REVERSE</p></div><span class="arrow" aria-hidden="true">↗</span></a>
        <a class="asset" href="assets/coin-flip.svg" download="coin-flip.svg" aria-label="下载循环翻转动画 SVG"><div class="motion-thumb"><!-- PREVIEW_FLIP --></div><div><h2>流转 · 翻转</h2><p>03 / IN MOTION</p></div><span class="arrow" aria-hidden="true">↗</span></a>
        <a class="download" href="https://github.com/lan450/aurum-coin" target="_blank" rel="noopener"><span>完整组件 · GitHub</span><span aria-hidden="true">↗</span></a>
        <p class="note">透明背景 · 任意缩放 · 离线可用</p>
      </aside>
    </main>
    <footer><span>SOL & LUNA — THE SAME COIN</span><span>DESIGNED TO LEAVE IT TO CHANCE</span></footer>
  </div>
  <!-- INLINE_COMPONENT -->
  <script>
    const motionPreview = document.querySelector('.motion-thumb svg');
    const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
    const syncMotion = () => { if (motionPreference.matches) { motionPreview.pauseAnimations(); motionPreview.setCurrentTime(0); } else motionPreview.unpauseAnimations(); };
    motionPreference.addEventListener('change', syncMotion);
    syncMotion();

    // Single-file demo: when assets/*.svg are not next to the page (e.g. this
    // standalone index.html), download the inline preview SVG as a Blob instead.
    document.querySelectorAll('a.asset[download]').forEach(link => {
      link.addEventListener('click', event => {
        const preview = link.querySelector('svg');
        if (!preview) return;
        event.preventDefault();
        const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(preview)], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const downloader = document.createElement('a');
        downloader.href = url;
        downloader.download = link.getAttribute('download');
        document.body.appendChild(downloader);
        downloader.click();
        downloader.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      });
    });
  </script>
</body>
</html>
